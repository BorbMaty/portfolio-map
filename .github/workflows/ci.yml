# Build, test and audit every PR and push to main; deploy main to Cloudflare Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token is visible to every dependency script, and nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; a cancelled run on main could stop a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      # GitHub Release holding the terrain render the map tiles are cut from (ROADMAP 2.3: tiles are not in git).
      TERRAIN_RELEASE: terrain-src-2
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # terrain/ is a uv project (Python): its tests run here, and it cuts the map tiles the build reads.
      # The default cache keys on **/uv.lock. Pinned to a commit: setup-uv publishes no floating major tags (no @v10).
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Terrain tests
        working-directory: terrain
        run: uv run pytest -q
      # contents: read is enough to download a release asset of this repo.
      - name: Download the terrain render
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TERRAIN_RELEASE" --pattern render.png --dir tiles-src
      - run: pnpm tiles

      # Chromium is needed by both the PDF script and the smoke tests; --with-deps installs its system libraries.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build:all
      - run: pnpm test

      # Lighthouse CI is run via dlx so it stays out of package.json; reports are kept as an artifact, not uploaded publicly.
      - run: pnpm dlx @lhci/cli@0.16.x autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

      # Deploy only from main, and only once the Cloudflare project and SITE_URL are set (otherwise OG/canonical URLs point to localhost).
      # Not cloudflare/wrangler-action: it runs `pnpm add wrangler`, which pnpm 12 rejects (ERR_PNPM_IGNORED_BUILDS)
      # because wrangler's deps have unapproved install scripts. dlx runs wrangler outside package.json, like lhci above;
      # the skipped workerd build only matters for local dev, not for uploading dist/.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != '' && vars.SITE_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: pnpm dlx wrangler@4.169.0 pages deploy dist --project-name="$CLOUDFLARE_PROJECT" --branch=main

      # Checks content, not just status: Pages answers unknown paths with 200 + index.html when a site has no 404 page.
      # Retries cover transient network/5xx errors; wrangler returns only after production points at the new deploy.
      # No `shell: bash` here: its pipefail would fail on curl's broken pipe once `grep -q` exits early.
      - name: Check the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != '' && vars.SITE_URL != ''
        run: |
          SITE_URL="${SITE_URL%/}"
          curl -sSf --max-time 20 --retry 5 --retry-all-errors --retry-delay 10 "$SITE_URL/" | grep -qF "<link rel=\"canonical\" href=\"$SITE_URL/\">"
          curl -sSf --max-time 20 --retry 5 --retry-all-errors --retry-delay 10 -o /dev/null -w '%{content_type}' "$SITE_URL/cv.pdf" | grep -q '^application/pdf'
