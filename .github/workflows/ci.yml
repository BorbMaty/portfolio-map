# Build, test and audit every PR and push to main; deploy main to Cloudflare Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token is visible to every dependency script, and nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; a cancelled run on main could stop a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is needed by both the PDF script and the smoke tests; --with-deps installs its system libraries.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build:all
      - run: pnpm test

      # Lighthouse CI is run via dlx so it stays out of package.json; reports are kept as an artifact, not uploaded publicly.
      - run: pnpm dlx @lhci/cli@0.16.x autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

      # Deploy only from main, and only once the Cloudflare project and SITE_URL are set (otherwise OG/canonical URLs point to localhost).
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != '' && vars.SITE_URL != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main

      # Checks content, not just status: Pages answers unknown paths with 200 + index.html when a site has no 404 page.
      # Retries cover the few seconds before the new deployment is served.
      - name: Check the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != '' && vars.SITE_URL != ''
        run: |
          curl -sSf --retry 5 --retry-all-errors --retry-delay 10 "$SITE_URL/" | grep -qF "<link rel=\"canonical\" href=\"$SITE_URL/\">"
          curl -sSf --retry 5 --retry-all-errors --retry-delay 10 -o /dev/null -w '%{content_type}' "$SITE_URL/cv.pdf" | grep -q '^application/pdf'
